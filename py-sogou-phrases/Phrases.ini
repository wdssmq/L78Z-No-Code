;  搜狗五笔输入法--自定义短语配置文件

;  自定义短语说明：
;  1、自定义短语支持多行、空格、指定位置。
;  2、每条自定义短语最多支持 30000 个汉字，总共支持 300000 条自定义短语。
;  3、自定义短语的格式如下：

;  单行的格式：
;  字符串+英文逗号+数字（指定排序位置）=短语

;  多行的格式：
;  字符串+英文逗号+数字（指定排序位置）=
;  多行短语

;  具体格式可以参考下面的实例。
;  自定义短语文件名为 phrases.ini，存放在用户文件夹的根目录下。
;  4、最多支持 300000 行自定义短语。
;  5、自定义短语的用途有：快捷输入手机号、邮箱、诗词、小短文等，大家可以自由发挥。
;  6、时间函数功能。具体定义格式如下：
;  字符串+英文逗号+数字（指定排序位置）=#表达式
;  注意：表达式以英文#开头，后面的表达式中的每一个函数的前面都包含有英文$。
;  函数表如下：
;  函数           含义             举例
;  $year          年(4位)          2006、2008
;  $year_yy       年(2位)          06、08
;  $month         月               12、8、3
;  $month_mm      月               12、08、03
;  $day           日               3、13、22
;  $day_dd        日               03、13、22
;  $weekday       星期             0、1、2、5、6
;  $fullhour      时(24小时制)     2、8、13、23
;  $fullhour_hh   时(24小时制)     02、08、13、23
;  $halfhour      时(12小时制)     2、8、10、11
;  $halfhour_hh   时(12小时制)     02、08、10、11
;  $ampm          AM、PM(英)       AM、PM（大写）
;  $minute        分               2、8、15、28
;  $minute_mm     分               02、08、15、28
;  $second        秒               2、8、15、28
;  $second_ss     秒               02、08、15、28
;  $year_cn       年(中文4位)      二〇〇六
;  $year_yy_cn    年(中文2位)      〇六
;  $month_cn      月(中文)         十二、八、三
;  $day_cn        日(中文)         三、十三、二十二
;  $weekday_cn    星期(中文)       日、一、二、五、六
;  $fullhour_cn   时(中文24时制)   二、八、十三、二十三
;  $halfhour_cn   时(中文12时制)   二、八、一、十一
;  $ampm_cn       上午下午(中文)   上午、下午
;  $minute_cn     分(中文)         二、八、十五、二十八
;  $minute_mm_cn  分(中文)         零二、零八、十五、二十八
;  $second_cn     秒(中文)         二、八、十五、二十八
;  $second_ss_cn  秒(中文)         零二、零八、十五、二十八

;  示例格式
;  ldwd,1=复活节
;  五笔编码,词序=自定义短语
;  请注意：自定义短语长度不能超过 30000 个中英文字符，否则将被输入法自动截断


;  日期时间相关
; 将作为注释显示在短语列表里，方便理解和维护 ---
; -----
; jjad → 日期 ---
; -----
jjad,2=#$year 年 $month_mm 月 $day_dd 日
date,2=#$year 年 $month_mm 月 $day_dd 日
; -----
jjad,3=#$year-$month_mm-$day_dd
date,3=#$year-$month_mm-$day_dd
; -----
jjad,4=#$year_cn年$month_cn月$day_cn日
date,4=#$year_cn年$month_cn月$day_cn日
; -----
; jfuj → 时间 ---
; -----
jfuj,2=#$year 年 $month_mm 月 $day_dd 日 $fullhour_hh:$minute_mm:$second_ss
time,2=#$year 年 $month_mm 月 $day_dd 日 $fullhour_hh:$minute_mm:$second_ss
; -----
jfuj,3=#$year-$month_mm-$day_dd $fullhour_hh:$minute_mm:$second_ss
time,3=#$year-$month_mm-$day_dd $fullhour_hh:$minute_mm:$second_ss
; -----
jfuj,4=#$fullhour_hh:$minute_mm:$second_ss
time,4=#$fullhour_hh:$minute_mm:$second_ss
; -----
; xygk → 编号，用于生成文件名等 ---
; -----
xykg,2=#$year-$month_mm-$day_dd-$fullhour_hh-$minute_mm-$second_ss
; -----
xykg,3=#$year$month_mm$day_dd$fullhour_hh$minute_mm$second_ss
; -----

